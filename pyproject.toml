[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotify-playlist-taxonomy"
version = "0.0.0"
description = "Policy-first foundations for a personal, reviewable music classification system."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary - personal project" }
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_playlist_taxonomy"]
