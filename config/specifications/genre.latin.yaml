schema_version: "2"
specification_version: spec.genre.latin.v1
logical_playlist_id: genre.latin
status: reviewed
characteristic_vocabulary_version: characteristics.v1
purpose: Collect recordings grounded in Latin musical traditions across modern, popular, electronic, and traditional forms.
dimension_basis: musical_style
strong_indicators:
  - indicator_id: strong.001
    summary: Independent Latin tradition evidence
    match: all
    conditions:
      - {characteristic_id: style.traditions, operator: contains_any, values: [latin]}
    rationale: Regional or stylistic Latin evidence is primary and is not inferred from language alone.
supporting_indicators:
  - indicator_id: supporting.001
    summary: Latin rhythmic or regional arrangement traits
    match: any
    conditions:
      - {characteristic_id: tempo_rhythm.groove, operator: contains_any, values: [latin_clave, syncopated]}
      - {characteristic_id: arrangement.instrumentation, operator: contains_any, values: [traditional_regional, brass_led]}
      - {characteristic_id: tempo_rhythm.dance_impulse, operator: at_least, values: [medium]}
    rationale: These support independently researched Latin tradition but do not define it alone.
negative_indicators:
  - indicator_id: negative.001
    summary: Regional instrumentation without Latin evidence
    match: all
    conditions:
      - {characteristic_id: style.traditions, operator: contains_none, values: [latin]}
      - {characteristic_id: arrangement.instrumentation, operator: contains_any, values: [traditional_regional]}
    rationale: Regional instrumentation spans many non-Latin traditions.
hard_exclusions: []
ambiguity_guidance:
  insufficient_evidence: abstain
  borderline_notes: [Language, artist origin, or modern production alone is insufficient; Latin Pop and electronic Latin hybrids may receive several genres.]
version_guidance: [Cross-language edits normally preserve genre, while remixes and covers must be reassessed when their performed tradition changes.]
instrumental_vocal_guidance: [Instrumental Latin recordings are eligible; vocal language is neither required nor decisive.]
overlap_refs: [genre.latin__genre.world_traditional]
