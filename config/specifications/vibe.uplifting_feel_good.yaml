schema_version: "2"
specification_version: spec.vibe.uplifting_feel_good.v1
logical_playlist_id: vibe.uplifting_feel_good
status: reviewed
characteristic_vocabulary_version: characteristics.v1
purpose: Collect recordings that reliably elevate mood through positive, joyful, warm, playful, or triumphant character.
dimension_basis: subjective_character
strong_indicators:
  - indicator_id: strong.001
    summary: Clear positive-valence mood elevation
    match: all
    conditions:
      - {characteristic_id: affect_mood.positive_elevation, operator: at_least, values: [high]}
      - {characteristic_id: affect_mood.valence, operator: at_least, values: [positive]}
    rationale: Uplifting is defined by mood elevation rather than maximum energy.
  - indicator_id: strong.002
    summary: Exceptional mixed-valence uplift
    match: all
    conditions:
      - {characteristic_id: affect_mood.valence, operator: equals, values: [mixed]}
      - {characteristic_id: affect_mood.positive_elevation, operator: at_least, values: [very_high]}
    rationale: Cathartic or bittersweet material qualifies only when its positive mood-lifting effect is exceptionally strong and central.
supporting_indicators:
  - indicator_id: supporting.001
    summary: Joyful, warm, playful, or triumphant character
    match: any
    conditions:
      - {characteristic_id: affect_mood.qualities, operator: contains_any, values: [joyful, warm, playful, triumphant]}
      - {characteristic_id: vocals_lyrics.themes, operator: contains_any, values: [celebration, empowerment]}
    rationale: Sonic or thematic positivity may support the same axis while remaining separately evidenced.
negative_indicators:
  - indicator_id: negative.001
    summary: Dominant negative or bleak affect
    match: any
    conditions:
      - {characteristic_id: affect_mood.valence, operator: at_most, values: [negative]}
      - {characteristic_id: affect_mood.qualities, operator: contains_any, values: [bleak, ominous, sad]}
    rationale: Dominant negative affect conflicts with mood elevation; mixed evidence remains reviewable.
hard_exclusions: []
ambiguity_guidance:
  insufficient_evidence: abstain
  borderline_notes: [Do not require high arousal; mixed valence needs very high positive elevation, while merely incidental comfort or catharsis remains insufficient.]
version_guidance: [Assess alternate and acoustic versions independently when emotional direction changes.]
instrumental_vocal_guidance: [Instrumentals may qualify through strong sonic positivity; lyrical positivity is supportive but not required.]
overlap_refs: [vibe.uplifting_feel_good__vibe.euphoric_energetic__vibe.hype__vibe.motivational, activity.party__activity.road_trip__vibe.uplifting_feel_good]
