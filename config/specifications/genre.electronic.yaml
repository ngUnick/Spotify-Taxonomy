schema_version: "2"
specification_version: spec.genre.electronic.v1
logical_playlist_id: genre.electronic
status: reviewed
characteristic_vocabulary_version: characteristics.v1
purpose: Collect recordings whose musical identity is grounded in Electronic tradition, not merely recordings that use electronic tools.
dimension_basis: musical_style
strong_indicators:
  - indicator_id: strong.001
    summary: Independent Electronic tradition evidence
    match: all
    conditions:
      - {characteristic_id: style.traditions, operator: contains_any, values: [electronic]}
    rationale: Recognized Electronic style or lineage is the decisive signal.
supporting_indicators:
  - indicator_id: supporting.001
    summary: Electronic arrangement and programmed groove
    match: any
    conditions:
      - {characteristic_id: arrangement.acoustic_electronic_balance, operator: at_least, values: [mostly_electronic]}
      - {characteristic_id: arrangement.instrumentation, operator: contains_any, values: [electronic_synthesis]}
      - {characteristic_id: tempo_rhythm.groove, operator: contains_any, values: [four_on_floor, breakbeat]}
    rationale: Production traits support, but cannot substitute for, Electronic tradition evidence.
negative_indicators:
  - indicator_id: negative.001
    summary: Electronic tools serving another documented tradition
    match: all
    conditions:
      - {characteristic_id: style.traditions, operator: contains_none, values: [electronic]}
      - {characteristic_id: arrangement.acoustic_electronic_balance, operator: at_least, values: [mostly_electronic]}
    rationale: Electronic production is widespread and does not automatically define genre.
hard_exclusions: []
ambiguity_guidance:
  insufficient_evidence: abstain
  borderline_notes: [Electropop, electronic Rock, and hybrid score music may receive several genres only when each tradition is independently supported.]
version_guidance: [Remixes may gain Electronic eligibility even when the original does not; acoustic reconstructions are reassessed rather than inheriting it.]
instrumental_vocal_guidance: [Both instrumental and vocal Electronic recordings are eligible; vocal presence does not determine the genre.]
overlap_refs: [genre.pop__genre.rock__genre.electronic, genre.soundtracks_scores__genre.style_overlap]
