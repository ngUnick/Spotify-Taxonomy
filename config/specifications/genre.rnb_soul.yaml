schema_version: "2"
specification_version: spec.genre.rnb_soul.v1
logical_playlist_id: genre.rnb_soul
status: reviewed
characteristic_vocabulary_version: characteristics.v1
purpose: Collect recordings grounded in Rhythm and Blues or Soul traditions as one broad combined category.
dimension_basis: musical_style
strong_indicators:
  - indicator_id: strong.001
    summary: Independent R&B or Soul tradition evidence
    match: all
    conditions:
      - {characteristic_id: style.traditions, operator: contains_any, values: [rhythm_and_blues, soul]}
    rationale: Either documented tradition is sufficient for the combined category.
supporting_indicators:
  - indicator_id: supporting.001
    summary: Vocal and groove traits consistent with R&B/Soul
    match: any
    conditions:
      - {characteristic_id: vocals_lyrics.vocal_style, operator: contains_any, values: [sung]}
      - {characteristic_id: tempo_rhythm.groove, operator: contains_any, values: [syncopated, halftime]}
      - {characteristic_id: affect_mood.emotional_intensity, operator: at_least, values: [medium]}
    rationale: These support the tradition but are shared with Pop, Jazz, Hip-Hop, and other genres.
negative_indicators:
  - indicator_id: negative.001
    summary: Adjacent Pop or Hip-Hop without R&B/Soul evidence
    match: all
    conditions:
      - {characteristic_id: style.traditions, operator: contains_none, values: [rhythm_and_blues, soul]}
      - {characteristic_id: style.traditions, operator: contains_any, values: [pop, hip_hop]}
    rationale: Production adjacency and collaboration do not establish the combined category.
hard_exclusions: []
ambiguity_guidance:
  insufficient_evidence: abstain
  borderline_notes: [Treat R&B and Soul as one destination while preserving Pop and Hip-Hop as independent overlapping genres.]
version_guidance: [Remixes and covers are reassessed if their stylistic tradition changes; edits and remasters normally preserve genre.]
instrumental_vocal_guidance: [Instrumental R&B/Soul may qualify through tradition and groove evidence; expressive lead vocals are common but not mandatory.]
overlap_refs: [genre.rnb_soul__genre.pop__genre.hip_hop_rap]
