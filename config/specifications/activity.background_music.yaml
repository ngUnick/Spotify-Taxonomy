schema_version: "2"
specification_version: spec.activity.background_music.v1
logical_playlist_id: activity.background_music
status: reviewed
characteristic_vocabulary_version: characteristics.v1
purpose: Collect broadly unobtrusive recordings suitable beneath conversation, routine work, or ambient daily activity.
dimension_basis: functional_context
strong_indicators:
  - indicator_id: strong.001
    summary: High background compatibility with limited attention demand
    match: all
    conditions:
      - {characteristic_id: functional.background_compatibility, operator: at_least, values: [high]}
      - {characteristic_id: structure_attention.attention_demand, operator: at_most, values: [medium]}
    rationale: Background Music is defined by unobtrusive concurrent use rather than instrumental form.
supporting_indicators:
  - indicator_id: supporting.001
    summary: Stable dynamics and low abrupt-change risk
    match: any
    conditions:
      - {characteristic_id: energy_dynamics.dynamic_variation, operator: at_most, values: [medium]}
      - {characteristic_id: structure_attention.abrupt_change_risk, operator: at_most, values: [low]}
      - {characteristic_id: structure_attention.distraction_risk, operator: at_most, values: [medium]}
    rationale: Predictable behavior supports broad background use across moods and genres.
negative_indicators:
  - indicator_id: negative.001
    summary: Attention-dominating or repeatedly disruptive presentation
    match: any
    conditions:
      - {characteristic_id: structure_attention.attention_demand, operator: at_least, values: [very_high]}
      - {characteristic_id: structure_attention.abrupt_change_risk, operator: at_least, values: [very_high]}
    rationale: Strong cognitive capture undermines a background role.
hard_exclusions: []
ambiguity_guidance:
  insufficient_evidence: abstain
  borderline_notes: [Do not inherit membership from Studying or Coding/Focus; vocal tracks may qualify when the whole recording remains unobtrusive.]
version_guidance: [Live applause, extended intros, or remixes can change background compatibility and require version-specific assessment.]
instrumental_vocal_guidance: [Vocals are tolerated more broadly than in focus playlists when they remain unobtrusive; instrumental status is not required.]
overlap_refs: [activity.studying__activity.coding_focus__activity.background_music, activity.gaming__activity.background_music__vibe.euphoric_energetic, activity.sleeping__activity.background_music__vibe.chill__vibe.dreamy_atmospheric]
