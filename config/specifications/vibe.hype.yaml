schema_version: "2"
specification_version: spec.vibe.hype.v1
logical_playlist_id: vibe.hype
status: reviewed
characteristic_vocabulary_version: characteristics.v1
purpose: Collect recordings with forceful impact and strong personal or social activation without requiring positive valence.
dimension_basis: subjective_character
strong_indicators:
  - indicator_id: strong.001
    summary: Forceful personal activation
    match: all
    conditions:
      - {characteristic_id: energy_dynamics.intensity, operator: at_least, values: [high]}
      - {characteristic_id: functional.personal_activation, operator: at_least, values: [high]}
    rationale: Individual psych-up, competition, workout, or action energy qualifies only when substantial force or intensity is present.
  - indicator_id: strong.002
    summary: Forceful social activation
    match: all
    conditions:
      - {characteristic_id: energy_dynamics.intensity, operator: at_least, values: [high]}
      - {characteristic_id: functional.social_activation, operator: at_least, values: [high]}
    rationale: Crowd or shared excitement qualifies only when paired with substantial force or intensity.
supporting_indicators:
  - indicator_id: supporting.001
    summary: Heavy impact, aggression, or driving rhythm
    match: any
    conditions:
      - {characteristic_id: energy_dynamics.transient_force, operator: at_least, values: [high]}
      - {characteristic_id: affect_mood.qualities, operator: contains_any, values: [aggressive, triumphant, determined]}
      - {characteristic_id: tempo_rhythm.rhythmic_drive, operator: at_least, values: [high]}
    rationale: These reinforce Hype but do not require positive emotional valence.
negative_indicators:
  - indicator_id: negative.001
    summary: Restrained intensity
    match: all
    conditions:
      - {characteristic_id: energy_dynamics.intensity, operator: at_most, values: [low]}
    rationale: Low intensity conflicts with both personal and social Hype routes even when tempo or energy is high.
hard_exclusions: []
ambiguity_guidance:
  insufficient_evidence: abstain
  borderline_notes: [High energy without forceful personal or social activation is insufficient; Hype may be positive, aggressive, or dark and does not imply Gym suitability.]
version_guidance: [Clean edits usually preserve Hype; acoustic versions and remixes require independent intensity assessment.]
instrumental_vocal_guidance: [Instrumentals may qualify through impact and activation; aggressive or celebratory lyrics are supporting rather than mandatory.]
overlap_refs: [vibe.uplifting_feel_good__vibe.euphoric_energetic__vibe.hype__vibe.motivational, activity.party__vibe.hype__vibe.euphoric_energetic, activity.gaming__activity.coding_focus__vibe.hype__vibe.dreamy_atmospheric]
