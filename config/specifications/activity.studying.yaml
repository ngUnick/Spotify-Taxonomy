schema_version: "2"
specification_version: spec.activity.studying.v1
logical_playlist_id: activity.studying
status: reviewed
characteristic_vocabulary_version: characteristics.v1
purpose: Collect recordings that support reading, learning, or deliberate study through low distraction and stable cognitive background.
dimension_basis: functional_context
strong_indicators:
  - indicator_id: strong.001
    summary: Strong focus support with low distraction
    match: all
    conditions:
      - {characteristic_id: functional.focus_support, operator: at_least, values: [high]}
      - {characteristic_id: structure_attention.distraction_risk, operator: at_most, values: [low]}
    rationale: Study suitability prioritizes sustained concentration rather than instrumental status.
supporting_indicators:
  - indicator_id: supporting.001
    summary: Predictable structure and restrained abruptness
    match: any
    conditions:
      - {characteristic_id: structure_attention.repetition, operator: at_least, values: [medium]}
      - {characteristic_id: structure_attention.abrupt_change_risk, operator: at_most, values: [low]}
      - {characteristic_id: functional.background_compatibility, operator: at_least, values: [high]}
    rationale: Stability commonly supports study without requiring a specific genre or tempo.
negative_indicators:
  - indicator_id: negative.001
    summary: Prominent lyrics or high attention demand
    match: any
    conditions:
      - {characteristic_id: vocals_lyrics.vocal_presence, operator: one_of, values: [prominent_lead]}
      - {characteristic_id: structure_attention.attention_demand, operator: at_least, values: [high]}
    rationale: Prominent ordinary lyrics are negative evidence but not a universal hard exclusion.
hard_exclusions: []
ambiguity_guidance:
  insufficient_evidence: abstain
  borderline_notes: [Low-distraction vocals are permitted; personal familiarity and language comprehension may later require calibration.]
version_guidance: [Instrumental mixes, live versions, and remixes are assessed independently for distraction and abruptness.]
instrumental_vocal_guidance: [Do not require instrumental music; allow low-distraction vocals and treat prominent lyrical leads as negative evidence.]
overlap_refs: [activity.studying__activity.coding_focus__activity.background_music]
