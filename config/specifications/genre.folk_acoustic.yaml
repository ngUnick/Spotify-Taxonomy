schema_version: "2"
specification_version: spec.genre.folk_acoustic.v1
logical_playlist_id: genre.folk_acoustic
status: reviewed
characteristic_vocabulary_version: characteristics.v1
purpose: Collect recordings grounded in Folk tradition or a substantively acoustic singer-songwriter/ensemble idiom, without treating every acoustic version as Folk.
dimension_basis: musical_style
strong_indicators:
  - indicator_id: strong.001
    summary: Independent Folk tradition evidence
    match: all
    conditions:
      - {characteristic_id: style.traditions, operator: contains_any, values: [folk]}
    rationale: Documented Folk lineage independently establishes the Folk side of the combined category.
  - indicator_id: strong.002
    summary: Substantive acoustic performance or songwriting idiom
    match: all
    conditions:
      - {characteristic_id: arrangement.acoustic_electronic_balance, operator: one_of, values: [fully_acoustic, mostly_acoustic]}
      - {characteristic_id: arrangement.substantive_acoustic_idiom, operator: is, values: [true]}
    rationale: The acoustic route requires both an acoustic arrangement and contextual evidence of an intentional acoustic idiom; balance alone is insufficient.
supporting_indicators:
  - indicator_id: supporting.001
    summary: Acoustic instrumentation or narrative songwriting
    match: any
    conditions:
      - {characteristic_id: arrangement.instrumentation, operator: contains_any, values: [acoustic_strings, solo_instrument]}
      - {characteristic_id: vocals_lyrics.themes, operator: contains_any, values: [storytelling]}
      - {characteristic_id: atmosphere_space.qualities, operator: contains_any, values: [organic, intimate]}
    rationale: These reinforce Folk/Acoustic character but remain supporting evidence.
negative_indicators:
  - indicator_id: negative.001
    summary: Cosmetic acoustic version without Folk/Acoustic identity
    match: all
    conditions:
      - {characteristic_id: version.kind, operator: contains_any, values: [acoustic]}
      - {characteristic_id: arrangement.acoustic_electronic_balance, operator: at_least, values: [balanced]}
    rationale: An acoustic label should not qualify a version whose realized arrangement remains substantially electronic or hybrid.
hard_exclusions: []
ambiguity_guidance:
  insufficient_evidence: abstain
  borderline_notes: [Distinguish Country through independent tradition evidence; a recording can fit both. Fully or mostly acoustic balance alone does not establish this category without Folk lineage or a substantive acoustic idiom.]
version_guidance: [Acoustic versions are assessed independently and may qualify even when the original does not; remastering alone has no effect.]
instrumental_vocal_guidance: [Both instrumental acoustic works and vocal Folk songs are eligible; instrumental acoustic membership still requires contextual evidence of a substantive acoustic idiom, while storytelling is helpful but not mandatory.]
overlap_refs: [genre.folk_acoustic__genre.country]
