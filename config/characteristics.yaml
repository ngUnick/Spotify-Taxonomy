schema_version: "1"
vocabulary_version: characteristics.v1
status: reviewed

families:
  - {family_id: style, display_name: Style and tradition, description: Broad musical traditions supported by normalized independent evidence.}
  - {family_id: work_context, display_name: Work context, description: The recording's documented compositional or media-work function.}
  - {family_id: version, display_name: Version, description: Recording or release-version distinctions that can materially change suitability.}
  - {family_id: arrangement, display_name: Arrangement, description: Instrumentation and acoustic or electronic arrangement character.}
  - {family_id: vocals_lyrics, display_name: Vocals and lyrics, description: Vocal prominence and independently described lyrical themes.}
  - {family_id: cultural_context, display_name: Cultural context, description: "Platform-neutral artist-project, music-scene, and regional-cultural associations kept separate from musical Genre qualification."}
  - {family_id: tempo_rhythm, display_name: Tempo and rhythm, description: "Measured or perceived pace, groove, drive, and rhythmic continuity."}
  - {family_id: energy_dynamics, display_name: Energy and dynamics, description: "Perceived energetic force, intensity, and dynamic behavior."}
  - {family_id: timbre_production, display_name: Timbre and production, description: "Perceived density, brightness, distortion, bass, and percussion."}
  - {family_id: affect_mood, display_name: Affect and mood, description: Subjective emotional qualities kept separate from playlist decisions.}
  - {family_id: atmosphere_space, display_name: Atmosphere and space, description: Spatial and environmental character of the recording.}
  - {family_id: structure_attention, display_name: Structure and attention, description: "Repetition, complexity, change, and cognitive demand."}
  - {family_id: functional, display_name: Functional suitability, description: "Reusable context factors such as momentum, focus, movement, and fatigue risk."}

characteristics:
  - characteristic_id: style.traditions
    family_id: style
    display_name: Musical traditions
    definition: Independently supported broad musical traditions present in the recording.
    epistemic_role: normalized_fact
    version_sensitivity: may_vary
    value_schema:
      type: multi_enum
      allowed_values: &traditions
        - {value: pop}
        - {value: rock}
        - {value: metal}
        - {value: hip_hop}
        - {value: electronic}
        - {value: rhythm_and_blues}
        - {value: soul}
        - {value: jazz}
        - {value: blues}
        - {value: western_classical}
        - {value: folk}
        - {value: country}
        - {value: reggae}
        - {value: ska}
        - {value: latin}
        - {value: regional_traditional}
    normalization:
      aliases: {r&b: rhythm_and_blues, classical: western_classical, traditional: regional_traditional}
    provenance_expectations: &all_evidence
      evidence_required: true
      allowed_evidence_kinds: [sourced_fact, community_tag, editorial_description, user_assertion]
    missing_semantics: absent_means_unknown
    contradiction_policy: preserve_assertions

  - characteristic_id: work_context.function
    family_id: work_context
    display_name: Work function
    definition: Documented relationship between the recording and a screen, stage, or game work.
    epistemic_role: normalized_fact
    version_sensitivity: version_defining
    value_schema:
      type: multi_enum
      allowed_values:
        - {value: standalone_song}
        - {value: original_score}
        - {value: incidental_music}
        - {value: theme}
        - {value: work_specific_song}
        - {value: soundtrack_compilation_appearance}
    normalization: {aliases: {score: original_score, theme_song: theme}}
    provenance_expectations: *all_evidence
    missing_semantics: absent_means_unknown
    contradiction_policy: preserve_assertions

  - characteristic_id: version.kind
    family_id: version
    display_name: Version kind
    definition: Explicit recording or release-version form.
    epistemic_role: normalized_fact
    version_sensitivity: version_defining
    value_schema:
      type: multi_enum
      allowed_values:
        - {value: original}
        - {value: live}
        - {value: acoustic}
        - {value: remix}
        - {value: edit}
        - {value: extended}
        - {value: remaster}
        - {value: instrumental}
        - {value: cover}
        - {value: demo}
        - {value: alternate}
        - {value: clean}
        - {value: explicit}
    normalization: {aliases: {radio_edit: edit, remastered: remaster}}
    provenance_expectations: *all_evidence
    missing_semantics: absent_means_unknown
    contradiction_policy: preserve_assertions

  - characteristic_id: arrangement.acoustic_electronic_balance
    family_id: arrangement
    display_name: Acoustic/electronic balance
    definition: Dominant arrangement balance between acoustic and electronic sound generation.
    epistemic_role: derived_judgment
    version_sensitivity: may_vary
    value_schema:
      type: ordinal
      allowed_values:
        - {value: fully_acoustic, rank: 1}
        - {value: mostly_acoustic, rank: 2}
        - {value: balanced, rank: 3}
        - {value: mostly_electronic, rank: 4}
        - {value: fully_electronic, rank: 5}
    normalization: {aliases: {}}
    provenance_expectations: *all_evidence
    missing_semantics: absent_means_unknown
    contradiction_policy: preserve_assertions

  - characteristic_id: arrangement.substantive_acoustic_idiom
    family_id: arrangement
    display_name: Substantive acoustic idiom
    definition: Whether the exact recording is intentionally grounded in a substantive acoustic performance or songwriting idiom, supported by contextual performance and arrangement evidence rather than acoustic balance alone.
    epistemic_role: derived_judgment
    version_sensitivity: may_vary
    value_schema: {type: boolean}
    normalization: {aliases: {}}
    provenance_expectations: *all_evidence
    missing_semantics: absent_means_unknown
    contradiction_policy: preserve_assertions

  - characteristic_id: arrangement.orchestral_character
    family_id: arrangement
    display_name: Orchestral character
    definition: Degree to which orchestral writing and ensemble texture shape the recording.
    epistemic_role: either
    version_sensitivity: may_vary
    value_schema: &five_level
      type: ordinal
      allowed_values:
        - {value: very_low, rank: 1}
        - {value: low, rank: 2}
        - {value: medium, rank: 3}
        - {value: high, rank: 4}
        - {value: very_high, rank: 5}
    normalization: {aliases: {none: very_low, dominant: very_high}}
    provenance_expectations: *all_evidence
    missing_semantics: absent_means_unknown
    contradiction_policy: preserve_assertions

  - characteristic_id: arrangement.instrumentation
